<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<!-- Molde da imagem de compartilhamento (assets/og/og-image.png, 1200x630). Gerado por scripts/build-assets.js -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500&display=block">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:radial-gradient(700px 500px at 85% 20%,rgba(61,139,255,.28),transparent 70%),#06070A;color:#F3F5F8;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;padding:0 80px;position:relative}
  .txt{flex:1}
  .eb{font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:#3D8BFF;display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .eb::before{content:'';width:36px;height:2px;background:#3D8BFF}
  h1{font-size:150px;font-weight:800;line-height:.9;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:28px}
  p{font-size:38px;font-weight:600;color:#8A94A3;line-height:1.25;max-width:640px}
  p b{color:#F3F5F8;font-weight:600}
  .ring{position:absolute;right:70px;top:50%;transform:translateY(-50%);width:400px;height:520px}
  .ring::before{content:'';position:absolute;inset:40px 0;border:2px solid #1E232C;border-radius:50%}
  .ring img{position:relative;height:100%;margin:0 auto;display:block}
  .url{position:absolute;left:80px;bottom:44px;font-family:'JetBrains Mono',monospace;font-size:20px;color:#5B6575;letter-spacing:.05em}
</style></head>
<body>
  <div class="txt">
    <div class="eb">Criador de conteúdo Web3</div>
    <h1>Satou</h1>
    <p>Conteúdo que gera <b>confiança, comunidade e adoção</b>.</p>
  </div>
  <div class="ring"><img src="../assets/characters/character-hero.png" alt=""></div>
  <div class="url">@Satoukibijusu</div>
</body></html>
